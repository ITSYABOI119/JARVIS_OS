    - name: "Phase 4: Golden telemetry fixture up-to-date (Python)"
      run: |
        python3 phase3/scripts/gen_golden_pcap.py
        git diff --exit-code phase4/console/fixtures/golden.pcap || (echo "golden.pcap stale — regenerate & commit" && exit 1)

    - name: "Phase 4: Install Playwright (Chromium headless-shell)"
      run: |
        python -m pip install --upgrade pip
        pip install playwright==1.60.0
        python -m playwright install --with-deps --only-shell chromium

    - name: "Phase 4: Console logic unit test (Playwright, deterministic clock)"
      run: python3 phase4/console/test_console_logic.py

    - name: "Phase 4: Console E2E (Playwright, real SSE via --replay)"
      run: python3 phase4/console/test_console_e2e.py

    # A3 -- shellcheck coverage extended from 4 scripts to all 16 in phase3/scripts.
    # Two tiers, because the risk is not uniform:
    #   FULL severity  -- the scripts that write to a device or build the shipped image.
    #   -S error       -- the bench/qemu helpers: catch real breakage, do not gate style.
    # build_jarvis_x86.sh and create_boot_usb.sh needed one proven fix and five targeted
    # SC2012 disables to reach full severity; no behaviour-affecting edit was required, so
    # the pre-registered escape hatch (disable-annotate and defer) was NOT used.
    - name: "Phase 4: Installer + build/USB shellcheck (full); bench/qemu helpers (-S error)"
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        shellcheck --version
        # Tier 1 -- full severity: device writes and the shipped-image build.
        shellcheck phase3/scripts/install_jarvis_x86.sh phase3/scripts/test_install_jarvis_x86.sh \
                   phase3/scripts/build_jarvis_x86.sh phase3/scripts/create_boot_usb.sh \
                   phase3/scripts/reconstruct_sel4_tree.sh
        # Tier 2 -- errors only.
        shellcheck -S error phase3/scripts/setup_nvme_partition.sh phase3/scripts/reflash_usb.sh \
                   phase3/scripts/bench_engine_failed.sh phase3/scripts/bench_engine_models.sh \
                   phase3/scripts/bench_models.sh phase3/scripts/bench_quality.sh \
                   phase3/scripts/bench_sel4_inference.sh phase3/scripts/bench_single_speed.sh \
                   phase3/scripts/bench_speed_local.sh phase3/scripts/clear_nvme_log.sh \
                   phase3/scripts/qemu_test.sh phase3/scripts/qemu_test_nvme.sh \
                   phase3/scripts/coverage_report.sh
        # Coverage invariant: every .sh in phase3/scripts must be an ARGUMENT to one of
        # the two shellcheck commands above -- not merely mentioned somewhere in this file.
        #
        # A10 (2026-08-09): the previous version of this check was VACUOUS. It grepped the
        # whole of ci.yml for the basename, so coverage_report.sh satisfied it from the day
        # A8 landed -- purely because the `coverage` job INVOKES it -- while being
        # shellchecked by neither tier. The hardcoded "16/16" tally went stale in the same
        # commit and the gate could not see that either. Check the tier lists themselves,
        # and COMPUTE the tally so it cannot rot again.
        TIERED=$(sed -n '/# Tier 1/,/# Coverage invariant/p' .github/workflows/ci.yml \
                 | grep -oE 'phase3/scripts/[A-Za-z0-9_.-]+\.sh' | sort -u)
        for f in phase3/scripts/*.sh; do
          printf '%s\n' "$TIERED" | grep -qxF "$f" || {
            echo "::error::$f is in NEITHER shellcheck tier -- add it (full severity if it writes to a device or builds the image, -S error otherwise)"; exit 1; }
        done
        echo "shellcheck: $(printf '%s\n' "$TIERED" | grep -c .)/$(ls -1 phase3/scripts/*.sh | wc -l) phase3/scripts covered (tier membership verified, tally computed)"

    - name: "Phase 4: Installer dry-run + helper tests"
      run: |
        chmod +x phase3/scripts/install_jarvis_x86.sh phase3/scripts/test_install_jarvis_x86.sh
        bash phase3/scripts/test_install_jarvis_x86.sh

    - name: "Phase 3: x86 Timer (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_x86_timer.c phase3/src/drivers/x86_timer.c \
          -o /tmp/test_x86_timer
        /tmp/test_x86_timer

    - name: "Phase 3: Block Device (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_blk_dev.c phase3/src/drivers/blk_dev_x86.c \
          phase3/src/drivers/ahci.c \
          -o /tmp/test_blk_dev
        /tmp/test_blk_dev

    - name: "Phase 3: NVMe Driver (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nvme.c phase3/src/drivers/nvme.c \
          -o /tmp/test_nvme
        /tmp/test_nvme

    - name: "Phase 3: NVMe Log (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nvme_log.c phase3/src/drivers/nvme_log.c \
          -o /tmp/test_nvme_log
        /tmp/test_nvme_log

    # A8/1 -- SANITIZED PARSER SUITE. nvme_log decodes the durable telemetry log's header
    # and 512 B records off raw LBA, including the WRAP path where cursor arithmetic drives
    # the read offset -- an off-by-one there indexes outside the buffer, which is exactly the
    # class -O2 alone cannot see. This log is the headless box's only persistent record, so a
    # decode bug is discovered mid-diagnosis.
    - name: "Phase 3: NVMe Log (C, ASAN+UBSAN)"
      run: |
        gcc -Wall -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g -std=c11 \
          -D_POSIX_C_SOURCE=200809L -I phase3/src/drivers \
          phase3/src/drivers/test_nvme_log.c phase3/src/drivers/nvme_log.c \
          -o /tmp/test_nvme_log_san
        ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
        UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          /tmp/test_nvme_log_san

    # A6a -- the round-trip parse_nvme_log.py lacked (parse_episodic and
    # parse_action_audit both have one). This parser is the ONLY way the box's durable
    # log is read off-hardware, so a decode bug is invisible until someone is mid-
    # diagnosis. Fixtures are produced by driving the REAL nvme_log.c through its mock
    # disk, so the assertions are against bytes the shipping writer produced.
    # THREE cases because wrap-order is the subtle half; `wrapped` and `migrated` are
    # dumped FULL SIZE (2701 sectors) because parse_nvme_log derives its wrap modulus
    # from the buffer it is given, not from NVME_LOG_MAX_ENTRIES -- a truncated wrapped
    # capture would rotate by a different modulus than the writer used.
    - name: "Phase 3: NVMe-log parser round-trip (C -> Python)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nvme_log.c phase3/src/drivers/nvme_log.c \
          -o /tmp/tnvl
        /tmp/tnvl
        /tmp/tnvl --dump plain    /tmp/nvl_plain.bin
        /tmp/tnvl --dump wrapped  /tmp/nvl_wrapped.bin
        /tmp/tnvl --dump migrated /tmp/nvl_migrated.bin
        python3 phase3/scripts/test_parse_nvme_log.py \
          /tmp/nvl_plain.bin /tmp/nvl_wrapped.bin /tmp/nvl_migrated.bin

    # A6b -- drift gate on the fuzzer's differential oracle. hmac_vectors.h and
    # sha256_vectors.h are what fuzz_control_in.c checks our C crypto AGAINST. If the
    # committed headers stop matching what the generator produces, the fuzzer stays
    # green while attesting vectors nobody generated. Generation is deterministic
    # (fixed SEED, no clock, no urandom), so a mismatch is real drift, never flake.
    - name: "Phase 6: control-vector generator drift gate (Python)"
      run: python3 phase3/scripts/gen_control_vectors.py --check

    - name: "Phase 5: Episodic Store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          -I phase3/src/ai \
          phase3/src/ai/test_episodic_store.c phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_episodic_store
        /tmp/test_episodic_store

    - name: "Phase 5: Episodic Parser round-trip (Python)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L -I phase3/src/ai \
          phase3/src/ai/test_episodic_store.c phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_episodic_store
        /tmp/test_episodic_store --dump /tmp/epi_fixture.bin
        python3 phase3/scripts/test_parse_episodic.py /tmp/epi_fixture.bin

    - name: "Phase 5: Shared Context Pool (TSan)"
      run: |
        gcc -D_POSIX_C_SOURCE=200809L -fsanitize=thread -O1 -g -pthread -I phase3/src/ai \
          phase3/src/ai/test_shared_context.c phase3/src/ai/shared_context.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_shared_context_tsan
        /tmp/test_shared_context_tsan

    - name: "Phase 5: Shared Context Pool (O2)"
      run: |
        gcc -D_POSIX_C_SOURCE=200809L -O2 -pthread -I phase3/src/ai \
          phase3/src/ai/test_shared_context.c phase3/src/ai/shared_context.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_shared_context_o2
        /tmp/test_shared_context_o2

    - name: "Phase 5: G3 Retrieval scorer+assembler"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_g3_retrieval.c phase3/src/ai/g3_retrieval.c \
          -o /tmp/tg3 -lm
        /tmp/tg3

    - name: "Phase 5: Cache-Growth promotion logic (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_cache_growth.c phase3/src/ai/cache_growth.c \
          -o /tmp/tcg
        /tmp/tcg

    - name: "Phase 5: SHIELD-learning risk-map (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_shield_learn.c phase3/src/ai/shield_learn.c \
          -lm -o /tmp/tsl
        /tmp/tsl

    - name: "Phase 5: Semantic store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_semantic_store.c phase3/src/ai/semantic_store.c \
          -o /tmp/tsem
        /tmp/tsem

    # A8/1 -- SANITIZED PARSER SUITE. semantic_store decodes 512 B fact records off raw LBA.
    #
    # -O2 HERE, NOT THE -O1 THE OTHER SANITIZED STEPS USE, AND THE REASON IS RECORDED SO IT IS
    # NOT "TIDIED" BACK: at -O1 gcc's value-range propagation cannot prove the loop counter in
    # test_wrap() is bounded 1..6, so -Wformat-truncation computes snprintf("fact %d") as
    # "between 7 and 17 bytes into a destination of size 16" and -Werror rejects the build.
    # At -O2 VRP proves the bound and the warning does not arise. That is a COMPILE-TIME
    # analysis difference, NOT a defect and NOT a sanitizer finding -- the code is correct.
    # ASan and UBSan are fully functional at -O2; only stack-trace quality degrades slightly,
    # which -g -fno-omit-frame-pointer mitigates. The alternative was editing a test file to
    # satisfy an optimiser heuristic, which would have changed source to suit the gate.
    - name: "Phase 5: Semantic store (C, ASAN+UBSAN)"
      run: |
        gcc -Wall -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -O2 -g -std=c11 \
          -I phase3/src/ai \
          phase3/src/ai/test_semantic_store.c phase3/src/ai/semantic_store.c \
          -o /tmp/tsem_san
        ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
        UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          /tmp/tsem_san

    - name: "Phase 5: Semantic distill (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L -I phase3/src/ai \
          phase3/src/ai/test_semantic_distill.c phase3/src/ai/semantic_distill.c \
          phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/tsd
        /tmp/tsd

    - name: "Phase C: C/M2a Embedding vector store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_embed_store.c phase3/src/ai/embed_store.c \
          -o /tmp/tembs
        /tmp/tembs

    # A8/1 -- SANITIZED PARSER SUITE. embed_store decodes TWO-SECTOR records off raw LBA with a
    # checksum spanning both halves, so its offset arithmetic straddles a sector boundary --
    # the one place in the store family where a torn or miscomputed record reads past the
    # buffer rather than merely failing a checksum.
    - name: "Phase C: C/M2a Embedding vector store (C, ASAN+UBSAN)"
      run: |
        gcc -Wall -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g -std=c11 \
          -I phase3/src/ai \
          phase3/src/ai/test_embed_store.c phase3/src/ai/embed_store.c \
          -o /tmp/tembs_san
        ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
        UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          /tmp/tembs_san

    # THE ANCHOR for embed_mu.h: reads golden_vectors.npz's raw bytes (stdlib
    # zipfile, no numpy) and compares them bit-for-bit against the header's hex
    # float literals. Also runs the generator's --check drift gate, so a stale
    # header fails here rather than at a box gate weeks later.
    - name: "Phase C: mu bit-exactness vs golden_vectors.npz (Python)"
      run: python3 phase3/scripts/embed/test_embed_mu.py

    # The other half of the same risk, which only C can reach: that the COMPILER
    # parses those literals back to the intended bits (verified against
    # EMBED_MU_XOR, which the Python step above ties to the npz).
    - name: "Phase C: mu compiler round-trip (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_embed_mu.c -o /tmp/temu -lm
        /tmp/temu

    # C/M2b Leg A: the box probe's pair table must not drift from the eval set it is
    # compared against. Stdlib-only, so it runs here; the cosine reference itself
    # (cm2b_pair_cos.py) needs the 1.2 GB model and stays model-gated-local.
    - name: "Phase C: C/M2b recall-pair table up-to-date"
      run: python3 phase3/scripts/embed/gen_recall_pairs.py --check

    # The projection between them: embed(1024) -> meanproj -> truncate(128) -> L2.
    # Links the REAL g3_retrieval.c so the output is checked through the same
    # g3_vec_is_unit that g3_select_semantic gates on, not a reimplementation.
    - name: "Phase C: C/M2b mean-projection pipeline (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_embed_project.c phase3/src/ai/embed_project.c \
          phase3/src/ai/g3_retrieval.c -o /tmp/tep -lm
        /tmp/tep

    - name: "Phase 6: Action allowlist (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_action_allowlist.c phase3/src/ai/action_allowlist.c \
          -o /tmp/t_aa
        /tmp/t_aa

    - name: "Phase 6: SHIELD action gate (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_shield_action.c phase3/src/ai/shield_action.c \
          phase3/src/ai/action_allowlist.c phase3/src/ai/shield_learn.c \
          phase3/src/ai/decision_cache.c \
          -lm -o /tmp/t_sa
        /tmp/t_sa

    - name: "Phase 6: K/M2b-2 keyword-clean restart trigger (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_km2b_trigger.c phase3/src/ai/km2b_trigger.c \
          phase3/src/ai/shield_action.c phase3/src/ai/action_allowlist.c \
          phase3/src/ai/shield_learn.c phase3/src/ai/decision_cache.c \
          -lm -o /tmp/t_km2b
        /tmp/t_km2b

    - name: "Phase 6: K/M2c hang miss-counter (C)"
      run: |
        cd phase3/src/ai
        gcc -Wall -Werror -O2 -std=c11 -I. test_km2b_miss.c km2b_miss.c -o /tmp/t_km2b_miss
        /tmp/t_km2b_miss

    - name: "Phase 6: N2 PB-progress wait verdict (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_pb_progress.c phase3/src/ai/pb_progress.c \
          -o /tmp/tpbprog
        /tmp/tpbprog

    # ASAN because T3's bounds teeth are an exact-length heap array: an overflow past it must be
    # REPORTED by the sanitizer, not inferred from a survivor check. -O1 -g for a usable report.
    #
    # UBSAN_OPTIONS=halt_on_error=1 IS LOAD-BEARING, NOT BOILERPLATE. gcc's UBSan defaults to
    # print-and-continue: a "runtime error: ..." diagnostic goes to stderr and the process still
    # EXITS 0, so the step stays green. Measured on this exact toolchain with a signed-left-shift
    # probe -- plain run printed the diagnostic and exited 0; with halt_on_error=1 it exited 1.
    # Without these two vars every ASan/UBSan step here is vacuous against UBSan findings.
    # detect_leaks=0 because these are short-lived test binaries that deliberately do not free;
    # LeakSanitizer is a separate decision, not one to make silently inside a bounds gate.
    - name: "Phase 6: A9/1 control-IN index maintenance (C, ASAN)"
      run: |
        gcc -Wall -Werror -O1 -g -std=c11 -fsanitize=address,undefined \
          -D_POSIX_C_SOURCE=200809L -I phase3/src/ai \
          phase3/src/ai/test_ctrl_epi_index.c phase3/src/ai/ctrl_epi_index.c \
          phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/tcei
        ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
        UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          /tmp/tcei

    - name: "Phase 6: A9/2 PB crash-loop window (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_pb_health.c phase3/src/ai/pb_health.c \
          -o /tmp/tpbh
        /tmp/tpbh

    - name: "Phase C: C/M1b-3 embed region staleness (C)"
      run: |
        cd phase3/src/ipc
        gcc -Wall -Werror -O2 -std=c11 -I. test_embed_region.c embed_region.c -o /tmp/t_embed_region
        /tmp/t_embed_region

    - name: "Phase 6: K/M4 fault validity predicate (C)"
      run: |
        cd phase3/src/ai
        gcc -Wall -Werror -O2 -std=c11 -I. test_km2b_fault.c km2b_fault.c -o /tmp/t_km2b_fault
        /tmp/t_km2b_fault

    - name: "Phase 6: 6-1 Monitor framework (C)"
      run: |
        cd phase3/src/ai
        gcc -Wall -Werror -O2 -std=c11 -I. test_monitors.c monitors.c shield_action.c action_allowlist.c shield_learn.c -o /tmp/t_monitors
        /tmp/t_monitors
        # 6-5/M2b-2: the MON_EV_INPUT_DEAD event + its snapshot case are #if JARVIS_CONTROL_IN,
