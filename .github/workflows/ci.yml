    # property, not only a robustness one.
    - name: "Phase 6: 6-5/M4a Console-addr slot (C, ASAN+UBSAN)"
      run: |
        gcc -Wall -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g -std=c11 \
