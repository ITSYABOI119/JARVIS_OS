name: JARVIS AI-OS Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: pip install pyserial psutil

    # =====================================================================
    # Phase 1 C tests
    # =====================================================================

    - name: "Phase 1: Ring Buffer IPC (C)"
      run: |
        cd phase1/src/ipc
        gcc -Wall -Wextra -O2 -std=c11 -pthread \
          test_ipc.c ring_buffer.c \
          -o test_ipc -lrt -pthread
        ./test_ipc

    - name: "Phase 1: Decision Cache (C)"
      run: |
        cd phase1/src/cache
        gcc -Wall -Wextra -O2 -std=c11 \
          test_cache.c decision_cache.c cache_patterns.c \
          -o test_cache -lrt
        ./test_cache

    - name: "Phase 1: Driver Registry (C)"
      run: |
        cd phase1/src/drivers
        gcc -Wall -O2 -std=c11 -pthread \
          test_driver_registry.c driver_registry.c \
          -o test_driver_registry -pthread
        ./test_driver_registry

    - name: "Phase 1: VirtIO Block Driver (C)"
      run: |
        cd phase1/src/drivers
        gcc -O2 -std=c11 -D_GNU_SOURCE \
          test_virtio_blk.c virtio_blk.c virtio_core.c driver_registry.c \
          -o test_virtio_blk -lpthread
        ./test_virtio_blk

    # =====================================================================
    # Phase 2 C tests
    # =====================================================================

    - name: "Phase 2: Dual Ring Buffer (C)"
      run: |
        cd phase2/src/ipc
        gcc -O2 -I../../../phase1/src/cache -I../../../phase1/src/ipc \
          dual_ring_buffer.c test_dual_ring.c ../../../phase1/src/ipc/ring_buffer.c \
          -o test_dual_ring
        ./test_dual_ring

    - name: "Phase 2: IPC Handler (C)"
      run: |
        cd phase2/src/ipc
        gcc -O2 -I../../../phase1/src/cache -I../../../phase1/src/ipc \
          ipc_handler.c dual_ring_buffer.c ../../../phase1/src/ipc/ring_buffer.c \
          ../../../phase1/src/cache/decision_cache.c ../../../phase1/src/cache/cache_patterns.c \
          test_ipc_handler.c -o test_ipc_handler
        ./test_ipc_handler

    - name: "Phase 2: UART Logic (C)"
      run: |
        cd phase2/src/drivers
        gcc -O2 test_uart_logic.c -o test_uart_logic
        ./test_uart_logic

    # =====================================================================
    # Phase 2 Python tests
    # =====================================================================

    - name: "Phase 2: UART IPC Client (Python)"
      run: python3 phase2/src/ai/test_uart_ipc_client.py

    - name: "Phase 2: System Bootstrap (Python)"
      run: python3 phase2/src/ai/test_system_bootstrap.py

    - name: "Phase 2: Integration (Python)"
      run: python3 phase2/src/ai/test_integration.py

    - name: "Phase 2: UART Stress (Python)"
      run: python3 phase2/src/ai/test_uart_stress.py

    - name: "Phase 2: AI-UART Integration (Python)"
      run: python3 phase2/src/ai/test_ai_uart_integration.py

    # =====================================================================
    # Phase 3 C tests
    # =====================================================================

    - name: "Phase 3: GGUF Parser (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          phase3/src/ai/test_gguf_parser.c phase3/src/ai/gguf_parser.c \
          -I phase3/src/ai -o /tmp/test_gguf
        /tmp/test_gguf

    - name: "Phase 3: GGUF-to-ggml Loading (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          phase3/src/ai/test_gguf_to_ggml.c phase3/src/ai/gguf_parser.c \
          -I phase3/src/ai -lm -o /tmp/test_gguf_load
        /tmp/test_gguf_load

    - name: "Phase 3: Shared Memory IPC (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_GNU_SOURCE \
          phase3/src/ipc/test_shmem_ipc.c phase3/src/ipc/shmem_ipc.c \
          -I phase3/src/ipc -o /tmp/test_shmem
        /tmp/test_shmem

    - name: "Phase 3: UART 16550 (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_uart_16550.c phase3/src/drivers/uart_16550.c \
          -o /tmp/test_uart_16550
        /tmp/test_uart_16550

    - name: "Phase 3: PCI Enumeration (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_pci.c phase3/src/drivers/pci.c \
          -o /tmp/test_pci
        /tmp/test_pci

    - name: "Phase 3: AHCI Discovery (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_ahci.c phase3/src/drivers/ahci.c \
          -o /tmp/test_ahci
        /tmp/test_ahci

    - name: "Phase 3: Net Stack (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_net_stack.c phase3/src/drivers/net_stack.c \
          -o /tmp/test_net_stack
        /tmp/test_net_stack

    - name: "Phase 3: Net Cmd (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_net_cmd.c phase3/src/drivers/net_cmd.c \
          phase3/src/drivers/net_stack.c \
          -o /tmp/test_net_cmd
        /tmp/test_net_cmd

    - name: "Phase 3: AHCI I/O (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_ahci_io.c phase3/src/drivers/ahci.c \
          -o /tmp/test_ahci_io
        /tmp/test_ahci_io

    - name: "Phase 3: NIC RTL8168 (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nic.c phase3/src/drivers/nic_rtl8168.c \
          phase3/src/drivers/pci.c \
          -o /tmp/test_nic
        /tmp/test_nic

    - name: "Phase 3: NIC Intel I211 (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nic_i211.c phase3/src/drivers/nic_i211.c \
          phase3/src/drivers/pci.c \
          -o /tmp/test_nic_i211
        /tmp/test_nic_i211

    - name: "Phase 3: Net UDP Builder (C)"
      run: |
        # broadcast-only (the OFF/deploy path — net_udp.c is ungated; the M3-2b unicast folds out)
        gcc -Wall -Werror -O2 -std=c11 \
          -I phase3/src/drivers \
          phase3/src/drivers/test_net_udp.c phase3/src/drivers/net_udp.c \
          -o /tmp/test_net_udp
        /tmp/test_net_udp
        # 6-5/M3-2b: net_build_udp_unicast + the T-a..T-g tests are #if JARVIS_CONTROL_IN, so the
        # build above folds them out — recompile WITH the flag (the test_monitors precedent).
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_CONTROL_IN=1 \
          -I phase3/src/drivers \
          phase3/src/drivers/test_net_udp.c phase3/src/drivers/net_udp.c \
          -o /tmp/test_net_udp_ctrlin
        /tmp/test_net_udp_ctrlin

    - name: "Phase 3: Telemetry Packet (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 \
          -I phase3/src/drivers \
          phase3/src/drivers/test_jarvis_telemetry.c phase3/src/drivers/jarvis_telemetry.c \
          -o /tmp/test_jarvis_telemetry
        /tmp/test_jarvis_telemetry

    - name: "Phase 3: Telemetry Receiver (Python)"
      run: python3 phase3/scripts/test_telemetry_receiver.py

    - name: "Phase 4: Console honesty gate (Python)"
      run: python3 phase4/console/test_console_honesty.py

    - name: "Phase 4: Golden telemetry fixture up-to-date (Python)"
      run: |
        python3 phase3/scripts/gen_golden_pcap.py
        git diff --exit-code phase4/console/fixtures/golden.pcap || (echo "golden.pcap stale — regenerate & commit" && exit 1)

    - name: "Phase 4: Install Playwright (Chromium headless-shell)"
      run: |
        python -m pip install --upgrade pip
        pip install playwright==1.60.0
        python -m playwright install --with-deps --only-shell chromium

    - name: "Phase 4: Console logic unit test (Playwright, deterministic clock)"
      run: python3 phase4/console/test_console_logic.py

    - name: "Phase 4: Console E2E (Playwright, real SSE via --replay)"
      run: python3 phase4/console/test_console_e2e.py

    # A3 -- shellcheck coverage extended from 4 scripts to all 16 in phase3/scripts.
    # Two tiers, because the risk is not uniform:
    #   FULL severity  -- the scripts that write to a device or build the shipped image.
    #   -S error       -- the bench/qemu helpers: catch real breakage, do not gate style.
    # build_jarvis_x86.sh and create_boot_usb.sh needed one proven fix and five targeted
    # SC2012 disables to reach full severity; no behaviour-affecting edit was required, so
    # the pre-registered escape hatch (disable-annotate and defer) was NOT used.
    - name: "Phase 4: Installer + build/USB shellcheck (full); bench/qemu helpers (-S error)"
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        shellcheck --version
        # Tier 1 -- full severity: device writes and the shipped-image build.
        shellcheck phase3/scripts/install_jarvis_x86.sh phase3/scripts/test_install_jarvis_x86.sh \
                   phase3/scripts/build_jarvis_x86.sh phase3/scripts/create_boot_usb.sh
        # Tier 2 -- errors only.
        shellcheck -S error phase3/scripts/setup_nvme_partition.sh phase3/scripts/reflash_usb.sh \
                   phase3/scripts/bench_engine_failed.sh phase3/scripts/bench_engine_models.sh \
                   phase3/scripts/bench_models.sh phase3/scripts/bench_quality.sh \
                   phase3/scripts/bench_sel4_inference.sh phase3/scripts/bench_single_speed.sh \
                   phase3/scripts/bench_speed_local.sh phase3/scripts/clear_nvme_log.sh \
                   phase3/scripts/qemu_test.sh phase3/scripts/qemu_test_nvme.sh
        # Coverage invariant: every .sh in phase3/scripts must appear in one tier above.
        # Without this, adding a script silently lands OUTSIDE the gate -- the same
        # "new file, no step" hole the A5 completeness gate closes for tests.
        for f in phase3/scripts/*.sh; do
          grep -q "$(basename "$f")" .github/workflows/ci.yml || {
            echo "::error::$f is not covered by either shellcheck tier -- add it (full severity if it writes to a device or builds the image, -S error otherwise)"; exit 1; }
        done
        echo "shellcheck: 16/16 phase3/scripts covered (4 full severity, 12 at -S error)"

    - name: "Phase 4: Installer dry-run + helper tests"
      run: |
        chmod +x phase3/scripts/install_jarvis_x86.sh phase3/scripts/test_install_jarvis_x86.sh
        bash phase3/scripts/test_install_jarvis_x86.sh

    - name: "Phase 3: x86 Timer (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_x86_timer.c phase3/src/drivers/x86_timer.c \
          -o /tmp/test_x86_timer
        /tmp/test_x86_timer

    - name: "Phase 3: Block Device (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_blk_dev.c phase3/src/drivers/blk_dev_x86.c \
          phase3/src/drivers/ahci.c \
          -o /tmp/test_blk_dev
        /tmp/test_blk_dev

    - name: "Phase 3: NVMe Driver (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nvme.c phase3/src/drivers/nvme.c \
          -o /tmp/test_nvme
        /tmp/test_nvme

    - name: "Phase 3: NVMe Log (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          -I phase3/src/drivers \
          phase3/src/drivers/test_nvme_log.c phase3/src/drivers/nvme_log.c \
          -o /tmp/test_nvme_log
        /tmp/test_nvme_log

    - name: "Phase 5: Episodic Store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          -I phase3/src/ai \
          phase3/src/ai/test_episodic_store.c phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_episodic_store
        /tmp/test_episodic_store

    - name: "Phase 5: Episodic Parser round-trip (Python)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L -I phase3/src/ai \
          phase3/src/ai/test_episodic_store.c phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_episodic_store
        /tmp/test_episodic_store --dump /tmp/epi_fixture.bin
        python3 phase3/scripts/test_parse_episodic.py /tmp/epi_fixture.bin

    - name: "Phase 5: Shared Context Pool (TSan)"
      run: |
        gcc -D_POSIX_C_SOURCE=200809L -fsanitize=thread -O1 -g -pthread -I phase3/src/ai \
          phase3/src/ai/test_shared_context.c phase3/src/ai/shared_context.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_shared_context_tsan
        /tmp/test_shared_context_tsan

    - name: "Phase 5: Shared Context Pool (O2)"
      run: |
        gcc -D_POSIX_C_SOURCE=200809L -O2 -pthread -I phase3/src/ai \
          phase3/src/ai/test_shared_context.c phase3/src/ai/shared_context.c phase3/src/ai/decision_cache.c \
          -o /tmp/test_shared_context_o2
        /tmp/test_shared_context_o2

    - name: "Phase 5: G3 Retrieval scorer+assembler"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_g3_retrieval.c phase3/src/ai/g3_retrieval.c \
          -o /tmp/tg3 -lm
        /tmp/tg3

    - name: "Phase 5: Cache-Growth promotion logic (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_cache_growth.c phase3/src/ai/cache_growth.c \
          -o /tmp/tcg
        /tmp/tcg

    - name: "Phase 5: SHIELD-learning risk-map (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_shield_learn.c phase3/src/ai/shield_learn.c \
          -lm -o /tmp/tsl
        /tmp/tsl

    - name: "Phase 5: Semantic store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_semantic_store.c phase3/src/ai/semantic_store.c \
          -o /tmp/tsem
        /tmp/tsem

    - name: "Phase 5: Semantic distill (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L -I phase3/src/ai \
          phase3/src/ai/test_semantic_distill.c phase3/src/ai/semantic_distill.c \
          phase3/src/ai/episodic_store.c phase3/src/ai/decision_cache.c \
          -o /tmp/tsd
        /tmp/tsd

    - name: "Phase C: C/M2a Embedding vector store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_embed_store.c phase3/src/ai/embed_store.c \
          -o /tmp/tembs
        /tmp/tembs

    # THE ANCHOR for embed_mu.h: reads golden_vectors.npz's raw bytes (stdlib
    # zipfile, no numpy) and compares them bit-for-bit against the header's hex
    # float literals. Also runs the generator's --check drift gate, so a stale
    # header fails here rather than at a box gate weeks later.
    - name: "Phase C: mu bit-exactness vs golden_vectors.npz (Python)"
      run: python3 phase3/scripts/embed/test_embed_mu.py

    # The other half of the same risk, which only C can reach: that the COMPILER
    # parses those literals back to the intended bits (verified against
    # EMBED_MU_XOR, which the Python step above ties to the npz).
    - name: "Phase C: mu compiler round-trip (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_embed_mu.c -o /tmp/temu -lm
        /tmp/temu

    # C/M2b Leg A: the box probe's pair table must not drift from the eval set it is
    # compared against. Stdlib-only, so it runs here; the cosine reference itself
    # (cm2b_pair_cos.py) needs the 1.2 GB model and stays model-gated-local.
    - name: "Phase C: C/M2b recall-pair table up-to-date"
      run: python3 phase3/scripts/embed/gen_recall_pairs.py --check

    # The projection between them: embed(1024) -> meanproj -> truncate(128) -> L2.
    # Links the REAL g3_retrieval.c so the output is checked through the same
    # g3_vec_is_unit that g3_select_semantic gates on, not a reimplementation.
    - name: "Phase C: C/M2b mean-projection pipeline (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_embed_project.c phase3/src/ai/embed_project.c \
          phase3/src/ai/g3_retrieval.c -o /tmp/tep -lm
        /tmp/tep

    - name: "Phase 6: Action allowlist (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_action_allowlist.c phase3/src/ai/action_allowlist.c \
          -o /tmp/t_aa
        /tmp/t_aa

    - name: "Phase 6: SHIELD action gate (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_shield_action.c phase3/src/ai/shield_action.c \
          phase3/src/ai/action_allowlist.c phase3/src/ai/shield_learn.c \
          phase3/src/ai/decision_cache.c \
          -lm -o /tmp/t_sa
        /tmp/t_sa

    - name: "Phase 6: K/M2b-2 keyword-clean restart trigger (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_km2b_trigger.c phase3/src/ai/km2b_trigger.c \
          phase3/src/ai/shield_action.c phase3/src/ai/action_allowlist.c \
          phase3/src/ai/shield_learn.c phase3/src/ai/decision_cache.c \
          -lm -o /tmp/t_km2b
        /tmp/t_km2b

    - name: "Phase 6: K/M2c hang miss-counter (C)"
      run: |
        cd phase3/src/ai
        gcc -Wall -Werror -O2 -std=c11 -I. test_km2b_miss.c km2b_miss.c -o /tmp/t_km2b_miss
        /tmp/t_km2b_miss

    - name: "Phase 6: N2 PB-progress wait verdict (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_pb_progress.c phase3/src/ai/pb_progress.c \
          -o /tmp/tpbprog
        /tmp/tpbprog

    - name: "Phase C: C/M1b-3 embed region staleness (C)"
      run: |
        cd phase3/src/ipc
        gcc -Wall -Werror -O2 -std=c11 -I. test_embed_region.c embed_region.c -o /tmp/t_embed_region
        /tmp/t_embed_region

    - name: "Phase 6: K/M4 fault validity predicate (C)"
      run: |
        cd phase3/src/ai
        gcc -Wall -Werror -O2 -std=c11 -I. test_km2b_fault.c km2b_fault.c -o /tmp/t_km2b_fault
        /tmp/t_km2b_fault

    - name: "Phase 6: 6-1 Monitor framework (C)"
      run: |
        cd phase3/src/ai
        gcc -Wall -Werror -O2 -std=c11 -I. test_monitors.c monitors.c shield_action.c action_allowlist.c shield_learn.c -o /tmp/t_monitors
        /tmp/t_monitors
        # 6-5/M2b-2: the MON_EV_INPUT_DEAD event + its snapshot case are #if JARVIS_CONTROL_IN,
        # so the host-pure build above folds them out — recompile WITH the flag so the T7
        # both-ways teeth (snapshot keyword-clean AND un-BLOCKED through shield_assess) cover it.
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_CONTROL_IN=1 -I. test_monitors.c monitors.c shield_action.c action_allowlist.c shield_learn.c -o /tmp/t_monitors_ctrlin
        /tmp/t_monitors_ctrlin

    - name: "Phase 6: 6-2 Wake decision core (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_wake.c phase3/src/ai/wake.c \
          phase3/src/ai/shield_action.c phase3/src/ai/action_allowlist.c \
          phase3/src/ai/shield_learn.c phase3/src/ai/decision_cache.c \
          -lm -o /tmp/t_wake
        /tmp/t_wake

    - name: "Phase 6: 6-3 Behavior registry (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_behaviors.c phase3/src/ai/behaviors.c \
          phase3/src/ai/monitors.c phase3/src/ai/shield_action.c \
          phase3/src/ai/action_allowlist.c phase3/src/ai/shield_learn.c \
          phase3/src/ai/decision_cache.c -lm -o /tmp/t_behaviors
        /tmp/t_behaviors

    - name: "Phase 6: Action-audit store (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_action_audit.c phase3/src/ai/action_audit.c \
          -o /tmp/t_ac
        /tmp/t_ac

    - name: "Phase 6: Action-audit parser round-trip (Python)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -I phase3/src/ai \
          phase3/src/ai/test_action_audit.c phase3/src/ai/action_audit.c \
          -o /tmp/t_ac
        /tmp/t_ac --dump /tmp/act_fixture.bin
        python3 phase3/scripts/test_parse_action_audit.py /tmp/act_fixture.bin

    - name: "Phase 6: 6-5/M1 SHA-256 (C)"
      run: gcc -Wall -Werror -O2 -std=c11 -I phase3/src/crypto phase3/src/crypto/test_sha256.c phase3/src/crypto/sha256.c -o /tmp/t_sha && /tmp/t_sha

    - name: "Phase 6: 6-5/M1 HMAC-SHA256 (C)"
