name: JARVIS AI-OS Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # Manual trigger for the `coverage` job below. Deliberately NOT a schedule:
  # this repo has no scheduled workflows today, and a nightly is new
  # infrastructure with its own failure modes (silent drift, notification
  # fatigue) for an instrument that is read on demand, not watched.
  workflow_dispatch:

jobs:
  # =====================================================================
  # COVERAGE INSTRUMENT -- manual (workflow_dispatch) only.
  #
  # THIS JOB MUST NEVER FAIL ON A COVERAGE NUMBER. Not now, and not later as a
  # "we only added a small threshold" change. It exists to PRODUCE A JUDGED LIST
  # of branches that neither the unit suites nor the fuzzers reach, so a human
  # can decide which are worth aiming a corpus at. A percentage gate would turn
  # that list into a number to be gamed, and would start failing builds for
  # branches this repo has already judged unreachable-by-construction or
  # defensive. The ONLY legitimate failures here are its own infrastructure
  # errors: a missing tool, a compile failure, or a harness that exits non-zero.
  #
  # It is a SEPARATE job from `test` and neither job `needs` the other, so it can
  # never block a push or a PR.
  #
  # Placed BEFORE `test` deliberately: `test`'s step list is long and actively
  # appended to, and a job added at the file tail gets clobbered by a concurrent
  # whole-file write. (That is not hypothetical -- it already happened once.)
  # =====================================================================
  # =====================================================================
  # A10 BOOT SMOKE -- manual (workflow_dispatch) only. NON-GATING BY DESIGN.
  #
  # Nothing in CI had ever booted the image. All 134 gating steps in `test`
  # exercise host-compilable modules; main_x86.c and inference_server.c are
  # seL4-only, so the whole wiring/link/boot class was invisible to CI.
  # This job reconstructs the build tree from version control, builds the
  # shipped rootserver, and boots it under KVM.
  #
  # IT MUST NOT BECOME A REQUIRED CHECK until a stability distribution exists
  # for it. Promoting it is a separate, deliberate decision with its own review.
  #
  # NO CACHE, deliberately -- do not "optimise" one back in. Measured in the A10
  # spike: a pinned `repo sync` is ~6-8 s and a cold kernel+libs build ~21 s, so
  # a cache saves almost nothing, while a stale cached kernel that silently
  # diverges from the committed config is a WORSE failure than having no job.
  # The build script's config gate validates CONFIG, so it would happily pass a
  # right-config/stale-source cache -- exactly the C/M4 "undefined reference to
  # route_veto_centroids_ok" class. Reasoning: phase6/docs/A10_CI_BOOT_FEASIBILITY.md
  # =====================================================================
  boot-smoke:
    name: "A10 boot smoke (manual, NON-GATING)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: "deps"
      run: |
        s=$(date +%s)
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential cmake ninja-build python3-pip \
          gcc-multilib g++-multilib repo git libxml2-utils qemu-system-x86 \
          dosfstools mtools
        # SEL4_X86_QEMU_SETUP.md lists only protobuf / grpcio-tools / pyelftools.
        # That list is SHORT BY THREE, each found by the build dying on it:
        #   lxml  -- syscall_stub_gen.py            -> dies at step 29/264
        #   ply   -- the bitfield/types generators  -> FAILED shared_types_gen.h
        #   jinja2 / future -- carried from the seL4 tool chain's own requirements
        # Install all of them; the doc gap is recorded in the A10 feasibility doc.
        pip3 install --break-system-packages -q \
          protobuf grpcio-tools pyelftools lxml ply jinja2 future
        git config --global user.email "ci@example.com"
        git config --global user.name "ci"
        e=$(date +%s); echo "T_DEPS=$((e-s))s"

    - name: "reconstruct the seL4 tree from version control (self-verifying)"
      run: |
        s=$(date +%s)
        bash phase3/scripts/reconstruct_sel4_tree.sh --tree "$HOME/sel4-x86"
        e=$(date +%s); echo "T_RECONSTRUCT=$((e-s))s"

    - name: "enable JARVIS_MODEL_FAIL_PROBE=1 (runner-local, never committed)"
      run: |
        # WHY the probe rather than simply omitting a model: with no usable model
        # the box takes one of two very different paths, and only one is worth
        # asserting on.
        #   probe=1        -> g_model_bad latches -> PB_DISPATCH_OK() false ->
        #                     nothing is dispatched -> a CLEAN degraded boot.
        #   no model file  -> the model is never read, g_model_bad never latches,
        #                     PA keeps dispatching to a PB that cannot work, and
        #                     it crash-loops to the bound and emits [FATAL].
        # Both were measured in the A10 spike.
        sed -i 's/^#define JARVIS_MODEL_FAIL_PROBE 0$/#define JARVIS_MODEL_FAIL_PROBE 1/' \
            phase3/src/sel4/jarvis_debug.h
        grep -E "^#define JARVIS_MODEL_FAIL_PROBE" phase3/src/sel4/jarvis_debug.h
        grep -qE "^#define JARVIS_MODEL_FAIL_PROBE 1$" phase3/src/sel4/jarvis_debug.h \
          || { echo "::error::the sed did not take -- the define's form changed"; exit 1; }

    - name: "configure jbuild + build the shipped image"
      run: |
        s=$(date +%s)
        # CHICKEN-AND-EGG, and it is inherent rather than a workaround: cmake cannot
        # configure jarvis-x86 until the JARVIS sources exist (its add_executable lists
        # them), but build_jarvis_x86.sh -- the thing that copies them out of this repo
        # -- refuses to run until jbuild exists (:1032). So do the script's COPY pass
        # first and tolerate it failing at its own cmake, then configure for real, then
        # run it again to build. The copy is idempotent, so the second run re-copies
        # harmlessly. On the box this never arises: jbuild was configured by hand years
        # of commits ago and has simply persisted.
        mkdir -p "$HOME/sel4-x86/jbuild"
        bash phase3/scripts/build_jarvis_x86.sh "$GITHUB_WORKSPACE" > /tmp/copy.log 2>&1 || true
        echo "source-copy pass: $(grep -ciE '  (COPY|CREATED|SET) ' /tmp/copy.log || true) file actions"
        test -f "$HOME/sel4-x86/projects/jarvis-x86/apps/jarvis-inference/src/main.c" \
          || { echo "::error::the copy pass did not place Process B's sources"; tail -20 /tmp/copy.log; exit 1; }
        # The A10 workaround that used to sit here -- copying the current shmem_ipc.c
        # into src/ipc/ because the build script wrote it to src/ai/ -- is GONE, because
        # build_jarvis_x86.sh now copies it to src/ipc/ itself. Leaving it would have
        # masked a regression: CI would keep passing while the script drifted back.
        cd "$HOME/sel4-x86/jbuild"
        # CMAKE_HOME_DIRECTORY on the box is projects/jarvis-x86, NOT projects/sel4test
        # (recorded in phase3/sel4-tree/cmake-configure.txt). Configuring the wrong
        # source dir produces a tree that builds and then behaves differently.
        # DIRECT cmake, not init-build.sh. init-build.sh IGNORES a trailing source-dir
        # argument and configures whatever $TREE/easy-settings.cmake points at -- which
        # is a symlink to projects/sel4test. That silently produced
        # CMAKE_HOME_DIRECTORY=.../projects/sel4test, i.e. it built and booted STOCK
        # SEL4TEST's rootserver: a clean build, a passing config gate, "Booting all
        # finished", and no JARVIS output at all. This is the invocation RUN_JARVIS.md
        # documents, and it names the source dir unambiguously.
        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=../kernel/gcc.cmake \
          -DPLATFORM=x86_64 -DSIMULATION=OFF -DSMP=ON -DNUM_NODES=6 \
          -DKernelFPU=XSAVE -DKernelXSave=XSAVEOPT -DKernelXSaveFeatureSet=7 \
          -DKernelXSaveSize=832 -DKernelFastpath=ON \
          -DKernelDebugBuild=ON -DKernelPrinting=ON -DKernelIOMMU=OFF \
          -C ../projects/jarvis-x86/settings.cmake \
          ../projects/jarvis-x86 > /tmp/cfg.log 2>&1 \
          || { echo "::error::configure failed"; tail -30 /tmp/cfg.log; exit 1; }
        c=$(date +%s); echo "T_CONFIGURE=$((c-s))s"
        # Print the decisive cache values unconditionally. CMAKE_HOME_DIRECTORY in
        # particular: the box configures projects/jarvis-x86, and configuring
        # projects/sel4test instead yields a tree that builds and then behaves
        # differently, which is not visible anywhere else in the output.
        echo "--- cache after configure ---"
        grep -E "^CMAKE_HOME_DIRECTORY|^Kernel(IOMMU|RootCNodeSizeBits|MaxNumNodes|DebugBuild|Printing)|^(SMP|NUM_NODES|SIMULATION):" \
          CMakeCache.txt || true
        # ASSERT the source dir. This is the check whose absence cost the most: with
        # the wrong one, everything downstream succeeds and the job boots the wrong
        # rootserver. Nothing else in the output distinguishes the two.
        HOMEDIR=$(grep -m1 '^CMAKE_HOME_DIRECTORY' CMakeCache.txt | cut -d= -f2)
        case "$HOMEDIR" in
          */projects/jarvis-x86) echo "  OK  configured source dir is jarvis-x86" ;;
          *) echo "::error::configured the WRONG source dir: $HOMEDIR (expected .../projects/jarvis-x86)"; exit 1 ;;
        esac
        cd "$GITHUB_WORKSPACE"
        # build_jarvis_x86.sh copies phase3/src into the tree, re-asserts the kernel
        # flags, runs ninja, and finishes in the config gate -- now NINE invariants,
        # including the PRINTING/DEBUG_BUILD pair whose absence killed the spike's
        # hybrid boot with "unknown syscall 0xffffffffffffffe3" (seL4_DebugPutChar).
        # Capture in full: a build failure must be diagnosable from THIS run. A
        # `| tail -45` here showed only muslc's trailing config chatter and hid the
        # actual `FAILED:` line, costing a whole re-run to find.
        set +e
        bash phase3/scripts/build_jarvis_x86.sh "$GITHUB_WORKSPACE" > /tmp/build.log 2>&1
        rc=$?
        e=$(date +%s); echo "T_BUILD=$((e-c))s  T_BUILD_TOTAL=$((e-s))s  EXIT=$rc"
        if [ "$rc" -ne 0 ]; then
          echo "===== FAILED / error lines ====="
          # NB: the config gate prints "FAILED" with NO colon, so match both forms.
          # A colon-only pattern once made a CLEAN build with a FAILING GATE look
          # like a silent failure with no error line at all, which cost a re-run.
          grep -nE "FAILED|[Ee]rror:|ModuleNotFoundError|No such file" /tmp/build.log | head -30
          echo "===== kernel config as actually cached ====="
          grep -E "^Kernel(IOMMU|FPU|XSave|Fastpath|DebugBuild|Printing|MaxNumNodes)|^(SMP|NUM_NODES|SIMULATION|RELEASE|Sel4testAllowSettingsOverride):" \
            "$HOME/sel4-x86/jbuild/CMakeCache.txt" 2>/dev/null || echo "(no cache)"
          echo "===== last 40 ====="; tail -40 /tmp/build.log
          echo "::error::build failed (exit $rc)"; exit "$rc"
        fi
        tail -25 /tmp/build.log
        ls -l "$HOME/sel4-x86/jbuild/images/"

    - name: "NVMe image: >=10.1 GiB sparse, FAT32, with a >3.9 MiB GEMMA2B.GUF stub"
      run: |
        # SIZE is load-bearing: the raw-LBA stores start at LBA 21,100,000
        # (10.06 GiB). A smaller image cannot hold them and every store silently
        # fails to init. Sparse, so it costs 0 bytes on disk (measured).
        #
        # STUB SIZE is load-bearing too: JARVIS_MODEL_FAIL_PROBE=1 fires at
        # p == 1000 INSIDE the frame-allocation loop, which runs `p < n_pages`
        # where n_pages = ceil(model_size/4096). So the probe is reached only if
        # the file is FOUND on FAT32 *and* is larger than 1000*4096 = 3.9 MiB.
        # 8 MiB gives margin. Contents are irrelevant -- the probe aborts before
        # the read -- but the 8.3 NAME is load-bearing: fat32.c's name_match
        # compares exactly 11 bytes, "GEMMA2B GUF", with no separator.
        truncate -s 11G /tmp/nvme.img
        mkfs.vfat -F 32 -n JARVISDATA /tmp/nvme.img > /dev/null
        head -c 8388608 /dev/urandom > /tmp/stub.gguf
        mcopy -i /tmp/nvme.img /tmp/stub.gguf ::GEMMA2B.GUF
        echo "--- FAT32 root directory ---"
        mdir -i /tmp/nvme.img ::
        echo "on-disk=$(du -h /tmp/nvme.img | cut -f1) apparent=$(du -h --apparent-size /tmp/nvme.img | cut -f1)"

    - name: "boot under KVM"
      run: |
        set +e
        ls -l /dev/kvm
        sudo chmod 666 /dev/kvm
        [ -w /dev/kvm ] || { echo "::error::/dev/kvm not writable"; exit 1; }
        # POLL FOR THE MARKER rather than running a fixed wall-clock timeout.
        # A fixed `timeout 120` made this job FLAKY: of the first three runs, two
        # finished everything in well under 120 s (140 KB of serial) while the third
        # was still inside spawn_inference_process at the cut-off, having emitted only
        # 7 KB. Nothing was wrong with it -- runner throughput just varies -- but the
        # assertions saw a truncated log and failed. Polling makes a fast runner fast
        # and lets a slow one finish, which is what a smoke test should do.
        # The workload loop never exits, so SOMETHING must stop it either way.
        s=$(date +%s)
        qemu-system-x86_64 -enable-kvm -cpu host -smp 6 -m 12G -no-reboot \
          -nographic -serial file:/tmp/boot.log \
          -kernel "$HOME/sel4-x86/jbuild/images/kernel-x86_64-pc99" \
          -initrd "$HOME/sel4-x86/jbuild/images/sel4test-driver-image-x86_64-pc99" \
          -drive file=/tmp/nvme.img,if=none,id=nvme0,format=raw \
          -device nvme,serial=QEMU_NVME,drive=nvme0 </dev/null > /dev/null 2>&1 &
        QPID=$!
        DEADLINE=$(( $(date +%s) + 300 ))
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          # [CTRL-IN-STATS] is emitted at the [STATS] cadence, AFTER [MODEL-BAD] and
          # [SNAP], so seeing it means every asserted marker has already been printed.
          if grep -qF "[CTRL-IN-STATS]" /tmp/boot.log 2>/dev/null; then
            echo "marker reached after $(( $(date +%s) - s ))s"; break
          fi
          kill -0 "$QPID" 2>/dev/null || { echo "qemu exited early"; break; }
          sleep 2
        done
        sleep 3   # let the current [STATS] block finish writing
        kill "$QPID" 2>/dev/null; wait "$QPID" 2>/dev/null
        e=$(date +%s)
        echo "T_BOOT=$((e-s))s (poll-until-marker, 300 s cap)"
        echo "serial bytes: $(stat -c%s /tmp/boot.log 2>/dev/null || echo 0)"
        echo "===== first 60 lines ====="; head -60 /tmp/boot.log
        echo "===== last 30 lines ====="; tail -30 /tmp/boot.log

    - name: "ASSERT"
      run: |
        L=/tmp/boot.log
        fail=0
        # grep -F is REQUIRED, not stylistic. Every marker here contains brackets, so
        # without -F "[FATAL]" is a CHARACTER CLASS: it matches any line containing
        # F, A, T or L (it reported 34 on a log with zero), and "[MODEL-FAIL-PROBE]"
        # dies outright with "Invalid range end" on the L-F range. Fixed strings only.
        must_eq() { n=$(grep -cF -- "$2" "$L" || true); if [ "$n" -eq "$3" ]; then echo "  OK    $1 = $3"; else echo "  FAIL  $1 = $n (expected $3)"; fail=1; fi; }
        must_ge() { n=$(grep -cF -- "$2" "$L" || true); if [ "$n" -ge "$3" ]; then echo "  OK    $1 = $n (>= $3)"; else echo "  FAIL  $1 = $n (expected >= $3)"; fail=1; fi; }

        echo "--- the image ran ---"
        must_eq "reached user space"   "Booting all finished" 1
        must_eq "self-test 5/5"        "Self-Test: 5/5 PASS"  1

        echo "--- the stub reached the probe (proves the chosen artefact works) ---"
        must_eq "probe fired at p=1000" "[MODEL-FAIL-PROBE] forcing frame-alloc failure at p=1000" 1

        echo "--- the fail-closed path ---"
        must_ge "MODEL-BAD why=frame-alloc" "[MODEL-BAD] inference disabled why=frame-alloc" 1
        must_ge "SNAP model=UNUSABLE"       "model=UNUSABLE" 1
        must_eq "SNAP model=loaded"         "model=loaded"   0

        echo "--- no crash-loop (the reason the probe path is the one asserted) ---"
        must_eq "FATAL" "[FATAL]" 0

        echo "--- the durable index count on an EMPTY CI store ---"
        # A fresh sparse image carries no JEPI header at LBA 21,140,000, so the
        # control-IN store initialises empty and ctrl_index_build indexes ZERO
        # recallable records. The honest expectation is a SPECIFIC NUMBER, so
        # assert idx=0 and assert no other value appears -- not mere presence.
        must_ge "CTRL-IN-STATS idx=0" "idx=0" 1
        n_other=$(grep -oE 'idx=[0-9]+' "$L" | grep -vc 'idx=0' || true)
        if [ "$n_other" -eq 0 ]; then echo "  OK    no idx= value other than 0"; else echo "  FAIL  $n_other non-zero idx= values"; fail=1; fi

        echo "--- err=0 is the ONLY err value ever printed ---"
        vals=$(grep -oE 'err=[0-9]+' "$L" | sort -u | tr '\n' ' ')
        echo "  observed: [$vals]"
        if [ "$vals" = "err=0 " ]; then echo "  OK    err=0 only"; else echo "  FAIL  another err value appeared"; fail=1; fi

        echo ""
        echo "--- REPORTED, NOT ASSERTED: the runner is not representative ---"
        # untyped_count is a function of guest RAM. The box has 181 at 32 GiB; the
        # A10 spike measured 105 at -m 8G, and at 105 the M3 threadpool starts ZERO
        # workers. This job runs -m 12G and PRINTS what it got. Threading is
        # deliberately NOT asserted: a green that meant "0 workers is fine" would
        # be worse than having no job at all.
        grep -E "untyped_count|M3: started|numNodes|NN=" "$L" | head -6 | sed 's/^/  /' || echo "  (none printed)"
        echo "  ^ reported only. This job makes NO claim about threading or worker count."

        echo ""
        if [ "$fail" -eq 0 ]; then echo "BOOT SMOKE PASS"; else echo "::error::boot smoke FAILED"; exit 1; fi

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: a10-boot-smoke-logs
        path: |
          /tmp/boot.log
          /tmp/build.log
          /tmp/cfg.log
        if-no-files-found: warn

  coverage:
    name: "Coverage instrument (manual, non-gating)"
    if: github.event_name == 'workflow_dispatch'
    # ubuntu-24.04, NOT the `test` job's ubuntu-22.04, and pinned rather than
    # -latest so it cannot drift silently. 24.04 ships gcc/gcov 13, which is the
    # toolchain this instrument was verified end-to-end against locally; 22.04
    # ships gcc 11, whose gcov spells the JSON flag -i instead of -j. The script
    # probes for that difference and handles both, but a measurement instrument
    # should run on the toolchain its numbers were checked on rather than rely on
    # a fallback nobody has executed.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: "Coverage: build + run unit suites and fuzzers under gcov, judge the gaps"
      # gcov is driven directly (it ships with gcc); gcovr/lcov are deliberately
      # NOT installed -- pip refuses gcovr under PEP 668 without
      # --break-system-packages, and gcov's own JSON carries the per-line and
      # per-branch counts this instrument needs.
      run: bash phase3/scripts/coverage_report.sh

    - name: "Coverage: summarise the judged gaps (never a pass/fail criterion)"
      run: |
        python3 - <<'PY'
        import json
        d = json.load(open('phase3/scripts/coverage_report.json'))
        print('reviewed by lead:', d['judgements_reviewed'])
        print('total gaps:', d['totals']['uncovered_gaps'], d['totals']['by_judgement'])
        for r in d['results']:
            print('\n== %s' % r['module'])
            for u in r['uncovered']:
                print('  %-6s L%-5d %-28s %s' % (u['kind'], u['line'], u['judgement'], u['source'][:70]))
        PY

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: phase3/scripts/coverage_report.json
        if-no-files-found: error

  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: pip install pyserial psutil

    # =====================================================================
    # Phase 1 C tests
    # =====================================================================

    - name: "Phase 1: Ring Buffer IPC (C)"
      run: |
        cd phase1/src/ipc
        gcc -Wall -Wextra -O2 -std=c11 -pthread \
          test_ipc.c ring_buffer.c \
          -o test_ipc -lrt -pthread
        ./test_ipc

    - name: "Phase 1: Decision Cache (C)"
      run: |
        cd phase1/src/cache
        gcc -Wall -Wextra -O2 -std=c11 \
          test_cache.c decision_cache.c cache_patterns.c \
          -o test_cache -lrt
        ./test_cache

    - name: "Phase 1: Driver Registry (C)"
      run: |
        cd phase1/src/drivers
        gcc -Wall -O2 -std=c11 -pthread \
          test_driver_registry.c driver_registry.c \
          -o test_driver_registry -pthread
        ./test_driver_registry

    - name: "Phase 1: VirtIO Block Driver (C)"
      run: |
        cd phase1/src/drivers
        gcc -O2 -std=c11 -D_GNU_SOURCE \
          test_virtio_blk.c virtio_blk.c virtio_core.c driver_registry.c \
          -o test_virtio_blk -lpthread
        ./test_virtio_blk

    # =====================================================================
    # Phase 2 C tests
    # =====================================================================

    - name: "Phase 2: Dual Ring Buffer (C)"
      run: |
        cd phase2/src/ipc
        gcc -O2 -I../../../phase1/src/cache -I../../../phase1/src/ipc \
          dual_ring_buffer.c test_dual_ring.c ../../../phase1/src/ipc/ring_buffer.c \
          -o test_dual_ring
        ./test_dual_ring

    - name: "Phase 2: IPC Handler (C)"
      run: |
        cd phase2/src/ipc
        gcc -O2 -I../../../phase1/src/cache -I../../../phase1/src/ipc \
          ipc_handler.c dual_ring_buffer.c ../../../phase1/src/ipc/ring_buffer.c \
          ../../../phase1/src/cache/decision_cache.c ../../../phase1/src/cache/cache_patterns.c \
          test_ipc_handler.c -o test_ipc_handler
        ./test_ipc_handler

    - name: "Phase 2: UART Logic (C)"
      run: |
        cd phase2/src/drivers
        gcc -O2 test_uart_logic.c -o test_uart_logic
        ./test_uart_logic

    # =====================================================================
    # Phase 2 Python tests
    # =====================================================================

    - name: "Phase 2: UART IPC Client (Python)"
      run: python3 phase2/src/ai/test_uart_ipc_client.py

    - name: "Phase 2: System Bootstrap (Python)"
      run: python3 phase2/src/ai/test_system_bootstrap.py

    - name: "Phase 2: Integration (Python)"
      run: python3 phase2/src/ai/test_integration.py

    - name: "Phase 2: UART Stress (Python)"
      run: python3 phase2/src/ai/test_uart_stress.py

    - name: "Phase 2: AI-UART Integration (Python)"
      run: python3 phase2/src/ai/test_ai_uart_integration.py

    # =====================================================================
    # Phase 3 C tests
    # =====================================================================

    - name: "Phase 3: GGUF Parser (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          phase3/src/ai/test_gguf_parser.c phase3/src/ai/gguf_parser.c \
          -I phase3/src/ai -o /tmp/test_gguf
        /tmp/test_gguf

    - name: "Phase 3: GGUF-to-ggml Loading (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_POSIX_C_SOURCE=200809L \
          phase3/src/ai/test_gguf_to_ggml.c phase3/src/ai/gguf_parser.c \
          -I phase3/src/ai -lm -o /tmp/test_gguf_load
        /tmp/test_gguf_load

    - name: "Phase 3: Shared Memory IPC (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -D_GNU_SOURCE \
          phase3/src/ipc/test_shmem_ipc.c phase3/src/ipc/shmem_ipc.c \
          -I phase3/src/ipc -o /tmp/test_shmem
        /tmp/test_shmem

    - name: "Phase 3: UART 16550 (C)"
      run: |
        gcc -Wall -Werror -O2 -std=c11 -DJARVIS_TEST_MOCK \
          -I phase3/src/drivers \
          phase3/src/drivers/test_uart_16550.c phase3/src/drivers/uart_16550.c \
          -o /tmp/test_uart_16550
        /tmp/test_uart_16550

    - name: "Phase 3: PCI Enumeration (C)"
      run: |
