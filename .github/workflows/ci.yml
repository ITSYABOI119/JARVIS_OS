    - name: "Phase 6: 6-5/M4b Control reply builder (C)"
      run: gcc -Wall -Werror -O2 -std=c11 -I phase3/src/net -I phase3/src/crypto phase3/src/net/test_control_reply.c phase3/src/net/control_reply.c phase3/src/crypto/hmac_sha256.c phase3/src/crypto/sha256.c -o /tmp/t_reply && /tmp/t_reply

    # A8/1 -- SANITIZED SUITE. A builder rather than a parser, included deliberately: the text
